<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | My College Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">My College Website</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbar">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/courses">Courses</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="/register">Register</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/contact">Contact</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="registration-box shadow">
            <h2 class="text-center mb-4">Student Registration</h2>
            <div id="registrationMessage"></div>

            <form action="/register" method="POST" id="registrationForm">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" name="phone" class="form-control" placeholder="Enter 10 digit mobile number"
                           pattern="[0-9]{10}" maxlength="10" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Select Course</label>
                    <select name="course" id="courseSelect" class="form-select" required>
                        <option value="">Choose Course</option>
                        <option value="B.Sc Information Technology">
                            B.Sc Information Technology
                        </option>
                        <option value="BCA">BCA</option>
                        <option value="B.Com">B.Com</option>
                        <option value="BMS">BMS</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Submit Registration
                </button>
            </form>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <h4>My College Website</h4>
            <p>Navi Mumbai, Maharashtra, India</p>
            <p>Email: info@mycollegewebsite.com</p>
            <p>Phone: +91 9876543210</p>
            <hr>
            <p class="mb-0">© 2026 My College Website. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
